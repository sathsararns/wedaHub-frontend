map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve service addresses again after a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:3000;
    set $ai_upstream ai-service:8000;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /health/backend {
        proxy_pass http://$backend_upstream/health;
    }

    location = /health/ai {
        proxy_pass http://$ai_upstream/health;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 240s;
        client_max_body_size 2m;
    }

    location /socket.io/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
